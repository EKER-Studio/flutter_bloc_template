name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files (i18n)
        run: flutter gen-l10n

      - name: Run code generation (Build Runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --coverage --exclude-tags "golden,screenshot"

      - name: Generate Coverage Job Summary
        if: always()
        run: |
          if [ -f "coverage/lcov.info" ]; then
            sed -i.bak '/SF:.*\.g\.dart/,/end_of_record/d' coverage/lcov.info
            sed -i.bak '/SF:.*app_localizations.*\.dart/,/end_of_record/d' coverage/lcov.info
            rm -f coverage/lcov.info.bak

            TOTAL_LF=$(grep '^LF:' coverage/lcov.info | awk -F: '{s+=$2} END {print s}')
            TOTAL_LH=$(grep '^LH:' coverage/lcov.info | awk -F: '{s+=$2} END {print s}')

            if [ -n "$TOTAL_LF" ] && [ "$TOTAL_LF" -gt 0 ]; then
              PCT=$(awk "BEGIN {printf \"%.2f\", ($TOTAL_LH / $TOTAL_LF) * 100}")
              echo "### 📊 Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
              echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
              echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
              echo "| **Line Coverage** | \`$PCT%\` |" >> $GITHUB_STEP_SUMMARY
              echo "| **Lines Hit / Total** | \`$TOTAL_LH\` / \`$TOTAL_LF\` |" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-coverage-report
          path: coverage/lcov.info
          retention-days: 14
